# TwistCoin Core CI: build with tests enabled, then run the unit tests (ctest)
# and the functional test suite (test/functional/test_runner.py).
#
# A full build plus the functional suite takes a long time on shared runners:
# raise the project's CI/CD job timeout (Settings > CI/CD > General pipelines)
# above GitLab's 60-minute default, or the job is killed before it finishes.

image: debian:bookworm

variables:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "2G"

stages:
  - test

test:
  stage: test
  timeout: 3h
  cache:
    key: ccache-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - ccache-main
    paths:
      - .ccache
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        cmake ninja-build build-essential ccache pkg-config
        libboost-dev libevent-dev libsqlite3-dev libzmq3-dev
        python3 python3-zmq
  script:
    - cmake -B build -G Ninja
        -DBUILD_GUI=OFF -DENABLE_IPC=OFF
        -DENABLE_WALLET=ON -DWITH_ZMQ=ON -DBUILD_TESTS=ON
        -DWITH_CCACHE=ON
    - cmake --build build -j"$(nproc)"
    - ccache --show-stats
    - ctest --test-dir build --output-on-failure -j"$(nproc)"
    - build/test/functional/test_runner.py -j"$(nproc)" --combinedlogslen=4000 --quiet
